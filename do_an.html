<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh menu</title>
    <link rel="stylesheet" href="do_an.css" />
  </head>
  <body>
    <header>
      <nav class="menu">
        <a id="logo" href="#">VN<span>Book</span></a>
        <a href="#">Trang chủ</a>
        <a href="">Sản phẩm</a>
        <a href="">Giỏ hàng</a>
        <a href="">Liên hệ</a>
        <a href="">Đăng nhập</a>
        <a href="">Đăng ký</a>
      </nav>
    </header>

    <form class="login">
      <label for="usename">Tên đăng nhập: </label>
      <input type="text" id="usename" />
      <br />

      <label for="pass">Mật khẩu:</label>
      <input type="password" id="pass" />
      <br />

      <button>Đăng nhập</button>
    </form>

    <form class="dangky">
      <label for="hoten">Họ và tên:</label>
      <input id="hoten" type="text" /> <br />

      <label for="pass">Passwork:</label>
      <input id="pass" type="passwork" /> <br />

      <label for="email">Email:</label>
      <input id="email" type="email" /> <br />

      <label for="birthday">Ngày sinh:</label>
      <input id="birthday" type="date" /> <br />

      <label for="gioitinh">Giới tính:</label>
      <select name="gioitinh" id="gioitinh">
        <option value="NAM">NAM</option>
        <option value="Nữ">NỮ</option>
      </select>
      <br />
      <label for="hobby">HOBBY:</label>
      <select name="hobby" id="hobby">
        <option value="Đá banh">Đá banh</option>
        <option value="Đánh lộn">Đánh lộn</option>
        <option value="choigai">Chơi gái</option>
      </select>
      <br />

      <label for="thanhpho">THÀNH PHỐ:</label>
      <select name="thanhpho" id="thanhpho">
        <option value="hue">Huế</option>
        <option value="hcm">Hồ Chí Minh</option>
        <option value="hn">Hà Nội</option>
      </select>
      <button>ĐĂNG KÝ</button>
    </form>

    <main>
      <div class="anhnen">
        <img src="/New folder/doan/img_book/pc2.jpg" />
      </div>
    </main>

    <script src="/New folder/doan/do_an.js"></script>
  </body>
</html>
